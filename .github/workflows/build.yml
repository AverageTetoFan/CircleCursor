name: Build Windows EXE

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:

      # Descargar el repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # Instalar Python 3.12.10
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      # Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyautogui pystray pillow

      # Crear el icono .ico
      - name: Create application icon
        shell: python
        run: |
          from PIL import Image, ImageDraw

          sizes = [16, 24, 32, 48, 64, 128, 256]
          images = []

          for size in sizes:
              image = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(image)

              margin = int(size * 0.15625)
              width = max(1, int(size * 0.09375))

              draw.ellipse(
                  (
                      margin,
                      margin,
                      size - margin,
                      size - margin
                  ),
                  outline="red",
                  width=width
              )

              images.append(image)

          images[-1].save(
              "CursorVisual.ico",
              format="ICO",
              sizes=[(img.width, img.height) for img in images],
              append_images=images[:-1]
          )

      # Compilar el EXE
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name CursorVisual --icon CursorVisual.ico main.py

      # Crear una Release y adjuntar el EXE
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "CursorVisual Build ${{ github.run_number }}"
          body: |
            Automated build of CursorVisual.

            Python: 3.12.10
            Build: ${{ github.run_number }}
          files: dist/CursorVisual.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
